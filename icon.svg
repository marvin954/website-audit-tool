<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- Browser window -->
  <rect x="60" y="80" width="392" height="352" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Title bar dots -->
  <circle cx="90" cy="108" r="8" fill="#ef4444"/>
  <circle cx="112" cy="108" r="8" fill="#eab308"/>
  <circle cx="134" cy="108" r="8" fill="#22c55e"/>
  
  <!-- URL bar -->
  <rect x="160" y="96" width="250" height="24" rx="6" fill="#1e293b"/>
  <text x="172" y="113" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">https://example.com</text>
  
  <!-- Audit score badge -->
  <rect x="80" y="140" width="80" height="40" rx="8" fill="#22c55e" opacity="0.2"/>
  <text x="120" y="166" font-family="system-ui,sans-serif" font-size="22" font-weight="700" fill="#22c55e" text-anchor="middle">87</text>
  <text x="80" y="166" font-family="system-ui,sans-serif" font-size="10" fill="#22c55e" opacity="0.7">/100</text>
  
  <!-- Issues list -->
  <g transform="translate(170,140)">
    <!-- Issue 1: passed -->
    <circle cx="12" cy="12" r="8" fill="#22c55e"/>
    <text x="0" y="16" font-family="system-ui,sans-serif" font-size="9" fill="#0f172a" font-weight="700" text-anchor="middle">✓</text>
    <text x="28" y="16" font-family="system-ui,sans-serif" font-size="12" fill="#f8fafc">Title tag</text>
    
    <!-- Issue 2: issue -->
    <circle cx="12" cy="40" r="8" fill="#ef4444"/>
    <text x="0" y="44" font-family="system-ui,sans-serif" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">✗</text>
    <text x="28" y="44" font-family="system-ui,sans-serif" font-size="12" fill="#f8fafc">Meta desc</text>
    
    <!-- Issue 3: issue -->
    <circle cx="12" cy="68" r="8" fill="#ef4444"/>
    <text x="0" y="72" font-family="system-ui,sans-serif" font-size="10" fill="#fff" font-weight="700" text-anchor="middle">✗</text>
    <text x="28" y="72" font-family="system-ui,sans-serif" font-size="12" fill="#f8fafc">Open Graph</text>
    
    <!-- Issue 4: passed -->
    <circle cx="12" cy="96" r="8" fill="#22c55e"/>
    <text x="0" y="100" font-family="system-ui,sans-serif" font-size="9" fill="#0f172a" font-weight="700" text-anchor="middle">✓</text>
    <text x="28" y="100" font-family="system-ui,sans-serif" font-size="12" fill="#f8fafc">HTTPS</text>
  </g>
  
  <!-- "A" badge -->
  <circle cx="400" cy="400" r="40" fill="#38bdf8" opacity="0.9"/>
  <text x="400" y="412" font-family="system-ui,sans-serif" font-size="28" font-weight="800" fill="#0f172a" text-anchor="middle">A</text>
</svg>
